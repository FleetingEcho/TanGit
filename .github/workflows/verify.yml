name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LAZYGITGO_TEST_REQUIRE_OPENSSH: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install OpenSSH and race-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential openssh-client openssh-server
      - name: Show verification tool versions
        run: |
          go version
          go tool mygo version
          git --version
          ssh -V
      - name: Configure Git for repository fixtures
        run: |
          git config --global user.name "lazygitGo CI"
          git config --global user.email "ci@lazygitgo.invalid"
      - name: Check the required OpenSSH test environment
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "OpenSSH integration tests require an unprivileged user" >&2
            exit 1
          fi
          test -x /usr/sbin/sshd
          command -v ssh-keygen
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet Go and MyGo UI lifetimes
        run: go tool mygo vet .
      - name: Test all packages with required OpenSSH coverage
        run: CGO_ENABLED=0 go test ./...
      - name: Stress asynchronous UI publication
        run: >-
          go test ./internal/app
          -run '^(TestRealGitContinueDetectsLengthInvariantChangesBeforeDriver|TestCodeCheckoutRefreshesFilesDocumentsAndSearchWithoutDiscardingEdits|TestAgentUpdateStaleGenerationCannotPublishResult|TestShowingTheWindowRefreshesEveryPage|TestClosingRepositoryCancelsReviewRead|TestReplacingRepositoryCancelsReviewRead|TestWorktreeTerminalWaitsForTargetTabAndKeepsIsolation|TestPushShowsConfirmationBeforeDiscoveryWithoutStartingWork|TestCancelingPushDuringDiscoveryDoesNotReopenConfirmation|TestWaitForUpdateRunsPendingCallbackAfterWakeCoalesces)$'
          -count=10 -timeout=5m
      - name: Race-test shared repository and agent state
        run: >-
          go test -race -timeout=20m
          ./internal/repository ./internal/agentwork ./internal/agentcli ./internal/app

  build-smoke:
    name: ${{ matrix.name }} build and smoke
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64
            executable: build/linux-amd64/lazygitgo
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            executable: build/darwin-universal/lazygitGo.app/Contents/MacOS/lazygitGo
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            executable: build/windows-amd64/lazygitGo.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build a smoke-test artifact
        shell: bash
        # Universal macOS runs on either hosted-runner architecture. Skipping
        # installers, DMGs and notarization keeps PR builds independent of
        # NSIS, signing identities, Apple credentials and updater secrets.
        run: |
          flags=(-skip-dmg -skip-installer -skip-notarize -sign -)
          if [ "${{ matrix.name }}" = Windows ]; then
            bash scripts/build-windows.sh "${{ matrix.platform }}" "${flags[@]}"
          else
            go tool mygo build -platform "${{ matrix.platform }}" "${flags[@]}"
          fi
      - name: Smoke the native executable through the headless CLI
        shell: bash
        run: |
          set +e
          output="$("${{ matrix.executable }}" agent help 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          grep --fixed-strings "lazygitGo agent" <<<"$output"
          grep --fixed-strings "lazygitGo local agent automation" <<<"$output"
      - name: Verify Debian upgrade identity
        if: matrix.name == 'Linux'
        run: |
          deb="build/linux-amd64/lazygitgo_$(jq -r .version mygo.json)_amd64.deb"
          bash scripts/prepare-debian-upgrade.sh build "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = lazygitgo
          test "$(dpkg-deb -f "$deb" Version)" = "$(jq -r .version mygo.json)"
          test "$(dpkg-deb -f "$deb" Conflicts)" = tangit
          test "$(dpkg-deb -f "$deb" Replaces)" = tangit
          dpkg-deb --fsys-tarfile "$deb" | tar -tf - > build/debian-files
          grep -Fx './usr/bin/lazygitGo' build/debian-files
          grep -Fx 'Name=lazygitGo' build/linux-amd64/lazygitgo.desktop
      - name: Verify macOS upgrade identity
        if: matrix.name == 'macOS'
        run: |
          plist=build/darwin-universal/lazygitGo.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = dev.tangit.desktop
      - name: Verify Windows upgrade identity
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-Item build/windows-amd64/lazygitGo.exe
          if ($exe.VersionInfo.ProductName -cne 'lazygitGo') {
            throw 'Unexpected Windows product name'
          }
          $output = & build/windows-amd64/TanGit.exe agent help
          if ($LASTEXITCODE -ne 0 -or -not ($output -match 'lazygitGo agent')) {
            throw 'The legacy Windows launcher failed'
          }
