name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      manually_verified:
        description: All release platforms were verified manually
        type: boolean
        required: true
        default: false
      existing_tag:
        description: Existing release tag to rebuild
        type: string
        required: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify.yml

  draft-release:
    needs: verify
    if: always() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.manually_verified && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.existing_tag && format('refs/tags/{0}', inputs.existing_tag) || github.sha }}
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_TAG: ${{ inputs.existing_tag }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          revision="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$EXISTING_TAG" ]; then
              test "$EXISTING_TAG" = "$tag"
              test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$revision"
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
            elif existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              test "$existing" = "$GITHUB_SHA"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            fi
          else
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "lazygitGo $RELEASE_TAG" --generate-notes
          fi

  build:
    needs: draft-release
    if: "!cancelled() && needs.draft-release.result == 'success'"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft-release.outputs.revision }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache terminal libraries
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_PLATFORM: ${{ matrix.name }}
        run: |
          mygo_dir="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)"
          manifest="$mygo_dir/plugins/terminal/mygo-plugin.json"
          cache_root="$(dirname "$(go env GOCACHE)")"
          case "$MYGO_PLATFORM" in
            macOS) prefix='darwin-' ;;
            Windows) prefix='windows-' ;;
            Linux) prefix='linux-' ;;
          esac
          while IFS=$'\t' read -r name url sha; do
            asset="${url##*/}"
            release="${url%/*}"
            release="${release##*/}"
            asset_id="$(gh api "repos/egoist/mygo/releases/tags/$release" |
              jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .id')"
            test -n "$asset_id"
            cache="$cache_root/mygo/natives/$sha"
            mkdir -p "$cache"
            gh api -H 'Accept: application/octet-stream' \
              "repos/egoist/mygo/releases/assets/$asset_id" > "$cache/$name"
            echo "$sha  $cache/$name" | sha256sum -c -
          done < <(jq -r --arg prefix "$prefix" '
            .libraries[] | select(.name == "libghostty-vt") | .files |
            to_entries[] | select(.key | startswith($prefix)) |
            [.value.name, .value.url, .value.sha256] | @tsv
          ' "$manifest")
      - name: Install NSIS for Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build signed updates and upload them to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ "${{ matrix.name }}" = Windows ]; then
            bash scripts/build-windows.sh "${{ matrix.platform }}" -upload
          else
            go tool mygo build -platform "${{ matrix.platform }}" -upload
          fi
      - name: Add Debian package upgrade metadata
        if: matrix.name == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir build --clobber
          debs=(build/linux-*/lazygitgo_*.deb)
          bash scripts/prepare-debian-upgrade.sh build "${debs[@]}"
          gh release upload "$RELEASE_TAG" --clobber "${debs[@]}" build/SHA256SUMS
