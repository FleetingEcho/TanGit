name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches mygo.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache terminal libraries
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_PLATFORM: ${{ matrix.name }}
        run: |
          mygo_dir="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)"
          manifest="$mygo_dir/plugins/terminal/mygo-plugin.json"
          case "$MYGO_PLATFORM" in
            macOS) prefix='darwin-' ;;
            Windows) prefix='windows-' ;;
            Linux) prefix='linux-' ;;
          esac
          while IFS=$'\t' read -r name url sha; do
            asset="${url##*/}"
            release="${url%/*}"
            release="${release##*/}"
            asset_id="$(gh api "repos/egoist/mygo/releases/tags/$release" |
              jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .id')"
            test -n "$asset_id"
            cache="${XDG_CACHE_HOME:-$HOME/.cache}/mygo/natives/$sha"
            mkdir -p "$cache"
            gh api -H 'Accept: application/octet-stream' \
              "repos/egoist/mygo/releases/assets/$asset_id" > "$cache/$name"
            echo "$sha  $cache/$name" | sha256sum -c -
          done < <(jq -r --arg prefix "$prefix" '
            .libraries[] | select(.name == "libghostty-vt") | .files |
            to_entries[] | select(.key | startswith($prefix)) |
            [.value.name, .value.url, .value.sha256] | @tsv
          ' "$manifest")
      - name: Install NSIS for Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build signed updates and upload them to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
